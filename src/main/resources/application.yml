server:
  port: 8070

spring:
  application:
    name: my-agent
  sql:
    init:
      # 交付即用:启动时幂等建表(classpath schema.sql 全部 IF NOT EXISTS),空库直启
      mode: always
  web:
    resources:
      cache:
        cachecontrol:
          # 静态资源强制 revalidate:HTML 永远拿最新(资源本体带 ?v= 版本号,未变时 304)
          no-cache: true
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:myagent}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-flex:
  global-config:
    # 驼峰 -> snake_case
    normal-value-of-logic-delete: null
  configuration:
    map-underscore-to-camel-case: true

myagent:
  model:
    # OpenAI 兼容协议,任意厂商:DeepSeek / Qwen(DashScope compatible-mode) / GLM / vLLM...
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:sk-demo}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: 0.7
    # LLM_MOCK=true:脚本化 Mock 模型,无 Key 跑通「拆解-分配-执行-汇报」全链路(演示/联调)
    mock: ${LLM_MOCK:false}
  team:
    # 调度对账循环(兜底;主路径是信箱写入事件驱动)
    reconcile-interval-ms: 2000
    # 成员 turn 租约:超时视为僵死,回收重投(借鉴 AionUi lease_expires_in_ms)
    lease-seconds: 600
    # 信箱投递重试上限,超过后槽位暂停并通知 Leader
    delivery-max-attempts: 3
    # 单成员单次唤醒最多注入的未读消息数
    wake-batch-size: 50
    # 失败重投指数退避:第 n 次重试等待 base*2^(n-2) ± 20% 抖动,封顶 cap(防重试风暴)
    retry-backoff-base-seconds: 5
    retry-backoff-cap-seconds: 120
  patrol:
    # 自动巡查:定时巡检任务/信箱/成员槽位/回合失败,异常落库 + SSE 事件 + Leader 通知
    enabled: true
    interval-ms: 30000
    stalled-minutes: 10          # IN_PROGRESS 任务停滞阈值(分钟)
    unassigned-minutes: 30       # 无主 PENDING 任务滞留阈值(分钟)
    backlog-age-minutes: 15      # 未读积压年龄阈值(分钟)
    backlog-unread: 30           # 未读积压数量阈值
    consecutive-failures: 3      # 连续回合失败次数阈值
    notify-cooldown-seconds: 600 # 同一发现重复通知 Leader 的冷却窗(秒)
    auto-nudge: true             # 停滞任务自动催办 owner
    auto-probe-paused: true      # 熔断半开:暂停槽位到期自动探活(失败回暂停、冷却翻倍)
    probe-base-seconds: 120      # 探活冷却基数(秒),按连续暂停次数指数退避
    probe-cap-seconds: 1800      # 探活冷却封顶(秒)
    inject-wake: true            # Leader 唤醒时注入巡查简报(MAPE-K Knowledge)
    unverified-lookback-minutes: 120  # 完成核验回看窗(分钟)
